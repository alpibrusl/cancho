name: ci

# A branch with a pull request is built by the pull request. `push: branches: ["**"]` as well ran every job twice for each
# push to such a branch (two runs, 24 check runs where 12 are the jobs), so only main is
# built on push.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request supersedes the run of the one before; a run on main is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # M0's acceptance criterion is a native binary on both default targets, so
  # the matrix is the acceptance criterion (#3).
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: darwin-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          cargo --version
          rustc --version --verbose

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --all-targets -- -D warnings

      # docs/region-chunk-cache.md §6: the brk count of nested regions is
      # checked under strace, and on Linux in CI it is not skipped.
      - name: strace (Linux)
        if: runner.os == 'Linux'
        run: command -v strace || (sudo apt-get update && sudo apt-get install -y strace)

      # Every test but the conformance suite, which runs in the `conformance` shards below (docs/ci-speed.md section 5).
      - name: Tests
        run: |
          cargo test --workspace --exclude cancho
          cargo test -p cancho --bins --test files --test fuzz

      # The milestone in one line: build the smoke program and run it.
      - name: Smoke — cancho build hello.cho && ./hello
        run: |
          cargo run --quiet -p cancho -- build examples/hello.cho -o hello
          ./hello
          test "$(./hello)" = "Hello, world!"

  # The conformance suite, the bulk of `cargo test --workspace` (docs/ci-speed.md section 5): in four shards of whole modules,
  # packed by `.github/conformance-weights.txt` so that none is much longer than the heaviest module. Each shard builds the
  # compiler and the test binary itself; the suite, which was one 33-minute step, is four of about a quarter of that.
  conformance:
    name: conformance (${{ matrix.target }}, ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [1, 2, 3, 4]
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: darwin-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: strace (Linux)
        if: runner.os == 'Linux'
        run: command -v strace || (sudo apt-get update && sudo apt-get install -y strace)

      - name: The conformance tests of this shard
        run: |
          python3 scripts/conformance_shard.py 4 ${{ matrix.shard }} > "$RUNNER_TEMP/shard.txt"
          wc -l < "$RUNNER_TEMP/shard.txt"
          cargo test -p cancho --test conformance -- --exact $(cat "$RUNNER_TEMP/shard.txt")

  # docs/self-hosting.md, epic #491: the whole conformance suite with every plain `cancho build` going through the compiler
  # written in cancho (`examples/selfhost`), so that a change to the language, the runtime or a rule that the compiler in
  # cancho does not follow fails here and not in someone's `--compiler auto`. The differences that are known are in
  # `.github/selfhost-known-differences.txt`; any other failure is new.
  selfhost:
    name: selfhost (${{ matrix.target }}, ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm]
        shard: [1, 2, 3, 4]
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: darwin-aarch64
          # The compiler in cancho writes code for Linux on aarch64 too (#481); GitHub's arm runners are free for public
          # repositories.
          - os: ubuntu-24.04-arm
            target: linux-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: strace (Linux)
        if: runner.os == 'Linux'
        run: command -v strace || (sudo apt-get update && sudo apt-get install -y strace)

      - name: The conformance suite through the compiler in cancho
        env:
          CANCHO_COMPILER: auto
          CANCHO_CACHE: ${{ runner.temp }}/cancho-cache
        run: |
          python3 scripts/conformance_shard.py 4 ${{ matrix.shard }} --skip-file .github/selfhost-known-differences.txt > "$RUNNER_TEMP/shard.txt"
          wc -l < "$RUNNER_TEMP/shard.txt"
          cargo test -p cancho --test conformance -- --exact $(cat "$RUNNER_TEMP/shard.txt")

  # docs/tls-performance.md §6: the cost of each primitive the TLS stack is made of, against the baseline recorded in
  # `benches/tls_baseline.json`. A change that makes a primitive 1.3 times dearer in instructions (counted under valgrind, so the
  # runner's clock and load do not matter) fails here. A short job: the compiler, then about a minute.
  #
  # The baseline is the code the Rust compiler writes. The job runs twice: with the Rust compiler (`CANCHO_COMPILER=rust`),
  # which it guards as before, and with the compiler in cancho (`CANCHO_COMPILER=auto`: no fall back to the Rust one, so a
  # build the compiler in cancho cannot do fails here and does not measure the Rust compiler's code). Since `clang -O2`
  # (#556) the compiler in cancho is within 1.05 of the baseline on all 36 rows (docs/bootstrap.md, "Code quality, measured
  # twice"), well inside the 1.3 the guard allows.
  tls-perf:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tls-perf
            compiler: rust
          - name: tls-perf (compiler in cancho)
            compiler: auto
    env:
      CANCHO_COMPILER: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4

      - name: Compiler
        run: cargo build --release -p cancho

      - name: Valgrind, which counts the instructions the guard compares
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: The primitives against the recorded baseline (docs/tls-performance.md §6)
        run: |
          ./target/release/cancho build --std tests/programs/tls_prims_bench.cho -o "$RUNNER_TEMP/tls_prims_bench"
          python3 scripts/tls_perf.py check "$RUNNER_TEMP/tls_prims_bench"

      - name: The guard can fail (X25519 and SHA-256 done twice in a copy of the benchmark)
        run: python3 scripts/tls_perf_mutant.py ./target/release/cancho

  # #208 (docs/tls-assurance.md §8): packages/tls against every other TLS
  # server the runner can install, and beside `openssl s_client` on the same
  # handshakes and on the lying server's cases, each failing on a row that
  # does not; then AFL++ over every fuzzing harness.
  #
  # Split into three parallel jobs, one per concern: the one job it was had
  # grown to a long serial run, and a long job on a GitHub-hosted runner is
  # more exposed to runner eviction ("The runner has received a shutdown
  # signal", exit 143), which is probabilistic and not a TLS failure. Shorter
  # parallel jobs reduce that exposure; they do not remove it. The step
  # commands are unchanged; only the grouping moved.
  tls-assurance:
    name: tls-assurance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx gnutls-bin libwolfssl-dev libmbedtls-dev libbotan-2-dev \
            android-libboringssl-dev python3-cryptography afl++ mosquitto-clients libssl-dev curl
      - name: Compiler, and the many-connection client
        run: |
          cargo build --release -p cancho
          ./target/release/cancho build --std tests/programs/tls_many.cho \
            packages/tls/{tls,record,message,slot,cident,client12,client,hello,identity,clientauth,ticket,server,saved}.cho \
            packages/x509/{verify,names,x509,key}.cho \
            -o "$RUNNER_TEMP/tls_many"
      - name: The committed package stores are current (docs/package-system.md §7.4)
        run: python3 scripts/publish_packages.py --check
      - name: Interop matrix (docs/tls-assurance.md §5)
        run: python3 scripts/tls_interop.py "$RUNNER_TEMP/tls_many"
      - name: Differential, the same handshakes (§4)
        run: python3 scripts/tls_differential.py --handshakes "$RUNNER_TEMP/tls_many"
      - name: Differential, the lying server (§4)
        run: python3 scripts/tls_differential.py
      - name: Fuzz, two minutes a harness, failing on any crash or hang (§3)
        run: python3 scripts/fuzz_afl.py "$RUNNER_TEMP/fuzz" der:120 chain:120 messages:120 client:120 flight:120

  # docs/tls-server.md §10: the server against OpenSSL, curl, Go, wolfSSL and
  # mosquitto, beside `openssl s_server` on the lying client's ClientHellos,
  # and its two fuzzing harnesses.
  tls-assurance-server:
    name: tls-assurance (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gnutls-bin libwolfssl-dev libmbedtls-dev libbotan-2-dev \
            android-libboringssl-dev python3-cryptography afl++ mosquitto-clients libssl-dev curl
      - name: Compiler, and the server
        run: |
          cargo build --release -p cancho
          echo "127.0.0.1 srv.example other.example a.wild.example" | sudo tee -a /etc/hosts
          ./target/release/cancho build --std tests/programs/tls_serve.cho \
            packages/tls/{tls,record,message,slot,cident,client12,client,hello,identity,clientauth,ticket,server,saved}.cho \
            packages/x509/{verify,names,x509,key}.cho \
            -o "$RUNNER_TEMP/tls_serve"
          ./target/release/cancho build --std tests/programs/tls_many.cho \
            packages/tls/{tls,record,message,slot,cident,client12,client,hello,identity,clientauth,ticket,server,saved}.cho \
            packages/x509/{verify,names,x509,key}.cho \
            -o "$RUNNER_TEMP/tls_many"
      - name: The server's interop matrix (docs/tls-server.md §10.2)
        run: python3 scripts/tls_server_interop.py "$RUNNER_TEMP/tls_serve"
      - name: The server's differential against openssl s_server (§10.3)
        run: python3 scripts/tls_server_differential.py

      # docs/tls-server.md §12.12: session tickets resumed by every client that keeps a session (and mosquitto, which
      # does not), two processes sharing a key file, and the same resumptions beside `openssl s_server`.
      - name: The server's session tickets, interop (docs/tls-server.md §12.12)
        run: python3 scripts/tls_server_tickets_interop.py "$RUNNER_TEMP/tls_serve" --many "$RUNNER_TEMP/tls_many"

      - name: The server's session tickets beside openssl s_server (§12.12)
        run: python3 scripts/tls_server_tickets_differential.py "$RUNNER_TEMP/tls_serve"
      # docs/tls-server.md §13.11: client certificates. The server asks for them (required, optional) and verifies what OpenSSL,
      # curl, Go, wolfSSL and mosquitto present (P-256, P-256 under an intermediate, P-384, RSA-PSS, Ed25519); the identity the
      # program is given is what OpenSSL reports for the same certificate. The lying client's flights go to the server and to
      # `openssl s_server -Verify/-verify`; and the recorded cases are the ones a fresh run makes, byte for byte.
      - name: Client certificates (docs/tls-server.md §13.11)
        run: |
          python3 scripts/tls_server_clientauth_interop.py "$RUNNER_TEMP/tls_serve"
          python3 scripts/tls_server_clientauth_differential.py "$RUNNER_TEMP/tls_serve"
          ./target/release/cancho build --std tests/programs/tls_server_driver.cho \
            packages/tls/{tls,record,message,slot,cident,client12,client,hello,identity,clientauth,ticket,server,saved}.cho \
            packages/x509/{verify,names,x509,key}.cho \
            -o "$RUNNER_TEMP/tls_server_driver"
          python3 scripts/tls_liar_client_auth.py "$RUNNER_TEMP/tls_server_driver" "$RUNNER_TEMP/liar_client_auth.txt"
          cmp "$RUNNER_TEMP/liar_client_auth.txt" tests/vectors/tls/liar_client_auth.txt
      # What a client certificate costs the server: the CPU of the server process a handshake, by key type, on this runner
      # (docs/tls-server.md §13.12).
      - name: Client certificates, cost (docs/tls-server.md §13.12)
        run: python3 scripts/tls_server_clientauth_cost.py "$RUNNER_TEMP/tls_serve" 10 3

      - name: Fuzz the server, two minutes a harness (§10.5)
        run: python3 scripts/fuzz_afl.py "$RUNNER_TEMP/fuzz_server" hello:120 server:120 clientauth:120

  # docs/tls-server.md §11 and docs/http-server.md §§11-12: the TLS echo
  # example, the HTTPS example, and their mutants -- the example the broker
  # and the gateway copy.
  tls-assurance-examples:
    name: tls-assurance (examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx python3-cryptography libssl-dev curl gcc libwolfssl-dev
      - name: Compiler
        run: cargo build --release -p cancho
      - name: The TLS echo example (docs/tls-server.md §11)
        run: |
          ./target/release/cancho build --std examples/tls_echo/{tls_echo,echo,front,identity}.cho \
            packages/tls/{tls,record,message,slot,cident,client12,client,hello,identity,clientauth,ticket,server,saved}.cho \
            packages/x509/{verify,names,x509,key}.cho \
            -o "$RUNNER_TEMP/tls_echo"
          python3 scripts/tls_echo_test.py "$RUNNER_TEMP/tls_echo" --cost 20
      # docs/http-server.md §11: the byte-fed `http.server` behind the TLS engine, against curl, `openssl s_client` and
      # Python's `ssl`/`http.client` (keep-alive, pipelining, 200 connections, a streamed 64 MiB body, a client that stops
      # reading, reload, the bounds), and its cost over TLS against the plain server, one core each. §12 adds uploads to the
      # cases: 0 bytes to 1 GiB with a length and chunked (SHA-256 checked), `Expect: 100-continue` (curl -T included), a client
      # that stalls half way (408), and 1,500 mangled uploads.
      - name: The HTTPS example (docs/http-server.md §11)
        run: |
          ./target/release/cancho build --std examples/https_hello/{hello,loop,app}.cho \
            examples/tls_echo/{front,identity}.cho packages/http-server/server.cho \
            packages/tls/{tls,record,message,slot,cident,client12,client,hello,identity,clientauth,ticket,server,saved}.cho \
            packages/x509/{verify,names,x509,key}.cho \
            -o "$RUNNER_TEMP/https_hello"
          python3 scripts/https_hello_test.py "$RUNNER_TEMP/https_hello"
          gcc -O2 -o "$RUNNER_TEMP/kload" benches/server/kload.c -lpthread
          gcc -O2 -o "$RUNNER_TEMP/tload" benches/server/tload.c -lssl -lcrypto -lpthread
          ./target/release/cancho build --std examples/api/api.cho packages/http-server/server.cho -o "$RUNNER_TEMP/api"
          python3 scripts/https_hello_test.py "$RUNNER_TEMP/https_hello" --cost 5 \
            --kload "$RUNNER_TEMP/kload" --tload "$RUNNER_TEMP/tload" --plain "$RUNNER_TEMP/api"
      # docs/http-client.md §9: the non-blocking HTTP client (`packages/http-client`) through `examples/http_fetch_nb`, against
      # servers that decide every byte they send (plain TCP and TLS 1.3), nginx (which ends connections with `Connection: close`
      # after 5 requests), the repository's own `https_hello`, and a server that damages its responses; then a million damaged
      # responses through the client with nothing to hold them but its buffers, its cost, and its mutants.
      - name: The HTTP client (docs/http-client.md §9)
        run: |
          ./target/release/cancho build --std examples/http_fetch_nb/{fetch,fetch_io}.cho \
            packages/http-client/{slot,wire,client}.cho \
            packages/tls/{tls,record,message,slot,cident,client12,client,hello,identity,clientauth,ticket,server,saved}.cho \
            packages/x509/{verify,names,x509,key}.cho \
            -o "$RUNNER_TEMP/http_fetch_nb"
          python3 scripts/http_client_test.py "$RUNNER_TEMP/http_fetch_nb" --https-hello "$RUNNER_TEMP/https_hello"
          ./target/release/cancho build --std packages/http-client/{slot,wire,client}.cho tests/programs/http_client_fuzz.cho -o "$RUNNER_TEMP/http_client_fuzz"
          "$RUNNER_TEMP/http_client_fuzz" 1000000 7
          ./target/release/cancho build --std packages/http-client/{slot,wire,client}.cho tests/programs/http_client_bench.cho -o "$RUNNER_TEMP/http_client_bench"
          "$RUNNER_TEMP/http_client_bench" 400000 8 26
          "$RUNNER_TEMP/http_client_bench" 400000 64 26
          ./target/release/cancho build --std examples/api/api.cho packages/http-server/server.cho -o "$RUNNER_TEMP/api"
          python3 scripts/http_client_test.py "$RUNNER_TEMP/http_fetch_nb" --pin --cost 5 \
            --server "$RUNNER_TEMP/api" --https-hello "$RUNNER_TEMP/https_hello"
      # docs/tls-parity.md §6.10: client certificates and ALPN against servers that ask for one and speak it: `openssl s_server`
      # (-Verify, -verify), nginx, Go and wolfSSL, in TLS 1.3 and 1.2, through the HTTP client's example driver (built above); and
      # beside `openssl s_client` on the lying server's flights (the same server code, the client's signature verified by it).
      - name: Client certificates and ALPN, the interop matrix (docs/tls-parity.md §6.10)
        run: |
          sudo mkdir -p /etc/cancho/http_fetch_nb && sudo chown "$USER" /etc/cancho/http_fetch_nb
          python3 scripts/tls_auth_interop.py "$RUNNER_TEMP/http_fetch_nb"

      - name: Client certificates and ALPN, the differential against openssl s_client (§6.10)
        run: python3 scripts/tls_differential_auth.py

  # The mutants of the HTTP server's byte-fed mode, of the HTTP client and of the streaming-body code: `cancho test` on mutated
  # sources, needing the compiler and nothing else, so each runs as its own job beside `tls-assurance (examples)` (docs/ci-speed.md
  # section 5: the two of them were 18 and 12 of that job's 46 minutes, one after the other).
  # docs/http-server.md §12 (streaming request bodies and `Expect: 100-continue`): `https_hello_test.py` ran the upload, expect,
  # halfbody and mangled cases; these are the mutants of the new code, against the tests without a socket. (The few lines only the
  # socket path runs have `--socket` mutants, which build `conformance/http_server_upload.rs` once per mutant; run by hand, §12.13.)
  tls-assurance-mutants:
    name: tls-assurance (mutants, ${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `limit`: about three times what each took (6, 22 and 17 minutes), in seconds. A run that has finished its work and
          # then does not end (the byte-fed job did, twice, on a runner) is killed with a process listing, not left to run.
          - name: byte-fed server
            script: http_server_bytes_mutants.py
            limit: 1200
          - name: HTTP client
            script: http_client_mutants.py
            limit: 3600
          - name: streaming body
            script: http_server_body_mutants.py
            limit: 3000
    steps:
      - uses: actions/checkout@v4
      - name: Compiler
        run: cargo build --release -p cancho
      - name: The mutants (docs/http-server.md §11.5, docs/http-client.md §9, docs/http-server.md §12.13)
        run: |
          # A mutant that crashes dumps a core, and on a runner every dump starts `apport`: 35 of them were running at once when the
          # byte-fed job's script had ended (run 39399728296), and the job's clean-up took 15 minutes after it. No core, no `apport`.
          ulimit -c 0
          rc=0
          timeout --signal=KILL ${{ matrix.limit }} python3 scripts/${{ matrix.script }} ./target/release/cancho </dev/null || rc=$?
          echo "the script ended with status $rc"
          ps -eo pid,ppid,pgid,etime,stat,args --forest | tail -40
          exit $rc

  # docs/satisfy.md (#406): the spec-to-implementation loop's first
  # end-to-end run is a checked property of this repository — the
  # committed contract/candidate pair, satisfied on every push.
  satisfy:
    name: satisfy-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: |
          cargo --version
          rustc --version --verbose
      - name: The committed contract is satisfied (cancho satisfy)
        run: |
          cargo build --release -p cancho
          ./target/release/cancho satisfy tests/satisfy/max.contract.cho tests/satisfy/max.candidate.cho --std

  # docs/hash-stability.md §7's plateau rule, as a checked property (#405):
  # every historical revision of every .cho under std/ and examples/ must
  # read under today's compiler, or its failing rule appear in the committed
  # exemption list with a reason. The number stays honest (exempted rules
  # still count as not reading); what fails the build is unexplained debt,
  # and an exemption that stops failing is reported so the list only shrinks.
  stability:
    name: stability-plateau
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The full history: the replay reads every distinct revision of
          # every tracked .cho, which a shallow clone does not have.
          fetch-depth: 0
      - name: Toolchain versions
        run: |
          cargo --version
          rustc --version --verbose
      - name: The plateau — every revision reads or its debt is explained
        run: |
          cargo build --release -p cancho
          python3 scripts/history.py --explain

  # docs/vcs.md §8 + #403: the store rides inside git. Once `.cancho/ids.txt`
  # is committed, a PR that changes what a declaration *is* — not the text,
  # the `SigId` a caller depends on — is a red diff here rather than a silent
  # index rewrite. Until the index lands, this stays a manual command:
  #   cancho vcs sync --dir . --check
  semantic-index:
    name: semantic-index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: |
          cargo --version
          rustc --version --verbose
      - name: The semantic index matches the source (cancho vcs sync --check)
        run: |
          cargo build --release -p cancho
          if [ -f .cancho/ids.txt ]; then
            ./target/release/cancho vcs sync --dir . --check
          else
            echo ".cancho/ids.txt not committed yet; the check starts when it lands"
          fi
