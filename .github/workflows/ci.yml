name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # M0's acceptance criterion is a native binary on both default targets, so
  # the matrix is the acceptance criterion (#3).
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: darwin-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          cargo --version
          rustc --version --verbose

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # The milestone in one line: build the smoke program and run it.
      - name: Smoke — cancho build hello.cho && ./hello
        run: |
          cargo run --quiet -p cancho -- build examples/hello.cho -o hello
          ./hello
          test "$(./hello)" = "Hello, world!"

  # #208 (docs/tls-assurance.md §8): packages/tls against every other TLS
  # server the runner can install, and beside `openssl s_client` on the same
  # handshakes and on the lying server's cases, each failing on a row that
  # does not; then AFL++ over every fuzzing harness, ten minutes in all.
  tls-assurance:
    name: tls-assurance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx gnutls-bin libwolfssl-dev libmbedtls-dev libbotan-2-dev \
            android-libboringssl-dev python3-cryptography afl++ mosquitto-clients libssl-dev curl

      - name: Compiler, and the many-connection client
        run: |
          cargo build --release -p cancho
          ./target/release/cancho build --std tests/programs/tls_many.cho \
            packages/tls/{tls,record,message,slot,client12,client,hello,identity,clientauth,ticket,server}.cho \
            packages/x509/{verify,names,x509,key}.cho \
            -o "$RUNNER_TEMP/tls_many"

      - name: The committed package stores are current (docs/package-system.md §7.4)
        run: python3 scripts/publish_packages.py --check

      - name: Interop matrix (docs/tls-assurance.md §5)
        run: python3 scripts/tls_interop.py "$RUNNER_TEMP/tls_many"

      - name: Differential, the same handshakes (§4)
        run: python3 scripts/tls_differential.py --handshakes "$RUNNER_TEMP/tls_many"

      - name: Differential, the lying server (§4)
        run: python3 scripts/tls_differential.py

      - name: Fuzz, two minutes a harness, failing on any crash or hang (§3)
        run: python3 scripts/fuzz_afl.py "$RUNNER_TEMP/fuzz" der:120 chain:120 messages:120 client:120 flight:120

      # docs/tls-server.md §10: the server against OpenSSL, curl, Go, wolfSSL and mosquitto, beside
      # `openssl s_server` on the lying client's ClientHellos, and its two fuzzing harnesses.
      - name: The server's interop matrix (docs/tls-server.md §10.2)
        run: |
          echo "127.0.0.1 srv.example other.example a.wild.example" | sudo tee -a /etc/hosts
          ./target/release/cancho build --std tests/programs/tls_serve.cho \
            packages/tls/{tls,record,message,slot,client12,client,hello,identity,clientauth,ticket,server}.cho \
            packages/x509/{verify,names,x509,key}.cho \
            -o "$RUNNER_TEMP/tls_serve"
          python3 scripts/tls_server_interop.py "$RUNNER_TEMP/tls_serve"

      - name: The server's differential against openssl s_server (§10.3)
        run: python3 scripts/tls_server_differential.py

      # docs/tls-server.md §13.11: client certificates. The server asks for them (required, optional) and verifies what OpenSSL,
      # curl, Go, wolfSSL and mosquitto present (P-256, P-256 under an intermediate, P-384, RSA-PSS, Ed25519); the identity the
      # program is given is what OpenSSL reports for the same certificate. The lying client's flights go to the server and to
      # `openssl s_server -Verify/-verify`; and the recorded cases are the ones a fresh run makes, byte for byte.
      - name: Client certificates (docs/tls-server.md §13.11)
        run: |
          python3 scripts/tls_server_clientauth_interop.py "$RUNNER_TEMP/tls_serve"
          python3 scripts/tls_server_clientauth_differential.py "$RUNNER_TEMP/tls_serve"
          ./target/release/cancho build --std tests/programs/tls_server_driver.cho \
            packages/tls/{tls,record,message,slot,client12,client,hello,identity,clientauth,ticket,server}.cho \
            packages/x509/{verify,names,x509,key}.cho \
            -o "$RUNNER_TEMP/tls_server_driver"
          python3 scripts/tls_liar_client_auth.py "$RUNNER_TEMP/tls_server_driver" "$RUNNER_TEMP/liar_client_auth.txt"
          cmp "$RUNNER_TEMP/liar_client_auth.txt" tests/vectors/tls/liar_client_auth.txt
      # What a client certificate costs the server: the CPU of the server process a handshake, by key type, on this runner
      # (docs/tls-server.md §13.12).
      - name: Client certificates, cost (docs/tls-server.md §13.12)
        run: python3 scripts/tls_server_clientauth_cost.py "$RUNNER_TEMP/tls_serve" 10 3

      - name: Fuzz the server, two minutes a harness (§10.5)
        run: python3 scripts/fuzz_afl.py "$RUNNER_TEMP/fuzz_server" hello:120 server:120 clientauth:120

      # docs/tls-server.md §11: the example the broker and the gateway copy, against `openssl s_client` and Python's
      # `ssl` (echoes, 200 connections, reload, the handshake bounds, idle, stop), and its cost on x86-64.
      - name: The TLS echo example (docs/tls-server.md §11)
        run: |
          ./target/release/cancho build --std examples/tls_echo/{tls_echo,echo,front,identity}.cho \
            packages/tls/{tls,record,message,slot,client12,client,hello,identity,clientauth,ticket,server}.cho \
            packages/x509/{verify,names,x509,key}.cho \
            -o "$RUNNER_TEMP/tls_echo"
          python3 scripts/tls_echo_test.py "$RUNNER_TEMP/tls_echo" --cost 20

      # docs/http-server.md §11: the byte-fed `http.server` behind the TLS engine, against curl, `openssl s_client` and
      # Python's `ssl`/`http.client` (keep-alive, pipelining, 200 connections, a streamed 64 MiB body, a client that stops
      # reading, reload, the bounds), and its cost over TLS against the plain server, one core each. §12 adds uploads to the
      # cases: 0 bytes to 1 GiB with a length and chunked (SHA-256 checked), `Expect: 100-continue` (curl -T included), a client
      # that stalls half way (408), and 1,500 mangled uploads.
      - name: The HTTPS example (docs/http-server.md §11)
        run: |
          ./target/release/cancho build --std examples/https_hello/{hello,loop,app}.cho \
            examples/tls_echo/{front,identity}.cho packages/http-server/server.cho \
            packages/tls/{tls,record,message,slot,client12,client,hello,identity,clientauth,ticket,server}.cho \
            packages/x509/{verify,names,x509,key}.cho \
            -o "$RUNNER_TEMP/https_hello"
          python3 scripts/https_hello_test.py "$RUNNER_TEMP/https_hello"
          gcc -O2 -o "$RUNNER_TEMP/kload" benches/server/kload.c -lpthread
          gcc -O2 -o "$RUNNER_TEMP/tload" benches/server/tload.c -lssl -lcrypto -lpthread
          ./target/release/cancho build --std examples/api/api.cho packages/http-server/server.cho -o "$RUNNER_TEMP/api"
          python3 scripts/https_hello_test.py "$RUNNER_TEMP/https_hello" --cost 5 \
            --kload "$RUNNER_TEMP/kload" --tload "$RUNNER_TEMP/tload" --plain "$RUNNER_TEMP/api"

      - name: The byte-fed mode's mutants (docs/http-server.md §11.5)
        run: python3 scripts/http_server_bytes_mutants.py ./target/release/cancho

      # docs/http-client.md §9: the non-blocking HTTP client (`packages/http-client`) through `examples/http_fetch_nb`, against
      # servers that decide every byte they send (plain TCP and TLS 1.3), nginx (which ends connections with `Connection: close`
      # after 5 requests), the repository's own `https_hello`, and a server that damages its responses; then a million damaged
      # responses through the client with nothing to hold them but its buffers, its cost, and its mutants.
      - name: The HTTP client (docs/http-client.md §9)
        run: |
          ./target/release/cancho build --std examples/http_fetch_nb/{fetch,fetch_io}.cho \
            packages/http-client/{slot,wire,client}.cho \
            packages/tls/{tls,record,message,slot,client12,client,hello,identity,clientauth,ticket,server}.cho \
            packages/x509/{verify,names,x509,key}.cho \
            -o "$RUNNER_TEMP/http_fetch_nb"
          python3 scripts/http_client_test.py "$RUNNER_TEMP/http_fetch_nb" --https-hello "$RUNNER_TEMP/https_hello"
          ./target/release/cancho build --std packages/http-client/{slot,wire,client}.cho tests/programs/http_client_fuzz.cho -o "$RUNNER_TEMP/http_client_fuzz"
          "$RUNNER_TEMP/http_client_fuzz" 1000000 7
          ./target/release/cancho build --std packages/http-client/{slot,wire,client}.cho tests/programs/http_client_bench.cho -o "$RUNNER_TEMP/http_client_bench"
          "$RUNNER_TEMP/http_client_bench" 400000 8 26
          "$RUNNER_TEMP/http_client_bench" 400000 64 26
          ./target/release/cancho build --std examples/api/api.cho packages/http-server/server.cho -o "$RUNNER_TEMP/api"
          python3 scripts/http_client_test.py "$RUNNER_TEMP/http_fetch_nb" --pin --cost 5 \
            --server "$RUNNER_TEMP/api" --https-hello "$RUNNER_TEMP/https_hello"

      - name: The HTTP client's mutants (docs/http-client.md §9)
        run: python3 scripts/http_client_mutants.py ./target/release/cancho

      # docs/http-server.md §12: streaming request bodies and `Expect: 100-continue`. `https_hello_test.py` above ran its upload, expect,
      # halfbody and mangled cases (uploads of 0 bytes to 1 GiB, hashed; 100 Continue; 408s; mangled bodies). These are the mutants of the
      # new code, against the tests without a socket. (The few lines only the socket path runs have `--socket` mutants, which build
      # `conformance/http_server_upload.rs` once per mutant; they were run by hand, §12.13.)
      - name: The streaming-body mutants (docs/http-server.md §12.13)
        run: python3 scripts/http_server_body_mutants.py ./target/release/cancho
