name: release

# A compiler release is a commit: the asset names carry the full hash, the same
# string a project's `cancho.toml` pins (docs/package-system.md §9). The tag is
# the hash too, not a version number, because that is what consumers name.
on:
  # The scripts and this file are tested where they change, on both targets.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/package-release.sh"
      - "scripts/install.sh"
      - "scripts/build-standalone.sh"
      - "scripts/stamp-version.sh"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release tagged cancho-<this commit's full hash> (otherwise build and smoke-test only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest runner image that is still supported: a binary links
          # against the glibc it was built with and runs on that or newer.
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: macos-latest
            target: darwin-aarch64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
    steps:
      - uses: actions/checkout@v4

      # Stage 0 of docs/standalone-cancho.md D5: the Rust build. It is shipped too, as `cancho-rust-…`, for Cranelift and WASI.
      - name: Build the Rust compiler (stage 0, and the backup asset)
        run: cargo build --release -p cancho

      # The compiler's output is LLVM IR with opaque pointers, which clang 15 introduced; the 22.04 image's default is 14.
      - name: A clang that can read it (22.04 only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-15
          echo "CLANG=clang-15" >> "$GITHUB_ENV"

      # The `cancho` of the release is built by cancho: stages 1 to 3, and stage 2 must equal stage 3.
      - name: Build the standalone cancho (stages 1 to 3)
        run: scripts/build-standalone.sh --out "$RUNNER_TEMP/standalone" --rev "$(git rev-parse HEAD)" --cancho0 "$PWD/target/release/cancho"

      - name: Package
        run: |
          CANCHO_BIN="$RUNNER_TEMP/standalone/cancho" scripts/package-release.sh ${{ matrix.target }} dist
          CANCHO_ASSET=cancho-rust scripts/package-release.sh ${{ matrix.target }} dist

      # What a consumer does, on the asset a consumer gets: install it by its hash, from a directory standing in for the
      # release, with no Rust and no cache around it, and build with it. `--std` is the library carried in the binary.
      - name: Smoke — install.sh from the packaged asset, then build hello
        run: |
          rev=$(git rev-parse HEAD)
          CANCHO_RELEASES="file://$PWD/dist" scripts/install.sh "$rev" "$RUNNER_TEMP/prefix"
          cancho="$RUNNER_TEMP/prefix/bin/cancho"
          "$cancho" --version
          # `--clang`, because the standalone cancho cannot read $CLANG (docs/standalone-cancho.md, slice 5).
          clang=$(command -v "${CLANG:-clang}")
          env -i PATH="/usr/bin:/bin:/usr/local/bin" HOME="$RUNNER_TEMP/home" CANCHO="$cancho" CLANG_PATH="$clang" sh -c '
            mkdir -p "$HOME" &&
            "$CANCHO" build examples/hello.cho --clang "$CLANG_PATH" -o "$HOME/hello" &&
            test "$("$HOME/hello")" = "Hello, world!" &&
            "$CANCHO" check examples/hello.cho --std'

      - uses: actions/upload-artifact@v4
        with:
          name: cancho-${{ matrix.target }}
          path: dist/*

  publish:
    # Only an explicit `publish` does; otherwise this builds and smoke-tests and stops.
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "cancho-$GITHUB_SHA" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "cancho $GITHUB_SHA" \
            --notes "Prebuilt cancho for commit $GITHUB_SHA, built by cancho (docs/standalone-cancho.md). cancho-rust-* is the Rust build, for Cranelift and WASI. Install: curl -fsSL https://raw.githubusercontent.com/alpibrusl/cancho/main/scripts/install.sh | sh"
