name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "book.toml"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.5.4"

      # docs/SUMMARY.md is book.toml's own table of contents; a chapter
      # docsync.toml never covered (see docs/ROADMAP.md's #126 row on why
      # that mechanism was removed) -- a stale entry here is caught by
      # `mdbook build` refusing a SUMMARY.md link to a file that does not
      # exist, not by a separate check.
      - name: Build the book
        run: mdbook build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
