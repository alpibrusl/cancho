name: seed-chain

# docs/seed.md §5, check 1: the chain from the committed seed. Stage 0 is
# `cancho0`, built by clang from seed/<target>.ll.gz; it builds stage 1, stage
# 1 builds stage 2, stage 2 builds stage 3, and stage 2 must equal stage 3. No
# Rust is built. A change to the compiler that uses a feature the committed
# seed does not compile fails here (the bootstrap rule).
on:
  pull_request:
    paths:
      - examples/selfhost/**
      - std/**
      - seed/**
      - scripts/build-standalone.sh
      - scripts/seed-build.sh
      - scripts/stamp-version.sh
      - .github/workflows/seed-chain.yml
  workflow_dispatch:

concurrency:
  group: seed-chain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  chain:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: macos-latest
            target: darwin-aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Stages 0 to 3 from the seed, stage 2 equal to stage 3
        run: scripts/build-standalone.sh --seed --out "$RUNNER_TEMP/standalone" --rev "$(git rev-parse HEAD)"
