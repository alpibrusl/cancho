[package]
name = "cancho"
description = "The cancho bootstrap compiler CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "cancho"
path = "src/main.rs"

[dependencies]
cancho-syntax.workspace = true
cancho-ir.workspace = true
cancho-types.workspace = true
cancho-id.workspace = true
cancho-codegen.workspace = true
cancho-codegen-llvm.workspace = true
cancho-vcs.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
acli = "0.5"
target-lexicon = "0.13"

[dev-dependencies]
tempfile = "3"
httparse = "1"
