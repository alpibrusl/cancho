[package]
name = "lex-sys"
description = "The lex-sys bootstrap compiler CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lex-sys"
path = "src/main.rs"

[dependencies]
lex-sys-syntax.workspace = true
lex-sys-ir.workspace = true
lex-sys-types.workspace = true
lex-sys-id.workspace = true
lex-sys-codegen.workspace = true
lex-sys-codegen-llvm.workspace = true
lex-sys-vcs.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
acli = "0.5"
target-lexicon = "0.13"

[dev-dependencies]
tempfile = "3"
httparse = "1"
