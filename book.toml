[book]
title = "lex-sys"
description = "A native systems language in which resource ownership and authority are part of the program's type-level contract."
authors = ["alpibrusl"]
src = "docs"
language = "en"

[build]
build-dir = "book"

[output.html]
git-repository-url = "https://github.com/alpibrusl/lex-sys"
edit-url-template = "https://github.com/alpibrusl/lex-sys/edit/main/{path}"
site-url = "/lex-sys/"
default-theme = "light"
preferred-dark-theme = "navy"

[output.html.search]
enable = true
limit-results = 20
