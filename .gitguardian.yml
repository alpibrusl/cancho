# GitGuardian / ggshield configuration.
#
# Scope, stated so it cannot mislead: this file governs ggshield CLI scans
# (pre-commit, `ggshield secret scan`) ONLY. It does not cover the GitGuardian
# dashboard / GitHub app: incidents it raises on already-pushed commits — the
# Good Samaritan emails — are closed by marking them false positive in the
# dashboard, once. This file keeps local and CI CLI scans quiet about the same
# class of content.
#
# What is ignored, and why each is public by construction (paths verified
# against `git ls-files`):
#
#   tests/vectors/x509/**         the x509 chain matrix: PEM and hex-encoded
#                                 *certificates* (the public half of a key
#                                 pair) generated by scripts/x509_matrix.py.
#   tests/vectors/fuzz/chain/**   fuzz corpus of certificate chains.
#   tests/vectors/tls/echo/*/chain.pem
#                                 the TLS echo test certificate chains.
#   **/.cancho-vcs/**            the content-addressed package stores
#                                 (packages/*/.cancho-vcs): op logs and
#                                 manifests whose sig_id/stage_id/source_hash
#                                 fields are BLAKE3 hex digests — high entropy
#                                 by design, never credentials.
#
# Deliberately NOT ignored: the rest of tests/vectors/, including
# tests/vectors/tls/echo/*/key.pem, which are committed throwaway TEST private
# keys. They are not secrets, but they are real key material, so they keep
# scanning as before.

secret:
  paths-ignore:
    - "tests/vectors/x509/**"
    - "tests/vectors/fuzz/chain/**"
    - "tests/vectors/tls/echo/*/chain.pem"
    - "**/.cancho-vcs/**"
