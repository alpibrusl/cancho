# GitGuardian / ggshield configuration.
#
# Scope, stated so it cannot mislead: this file governs ggshield CLI scans
# (pre-commit, `ggshield secret scan`). Incidents raised by the
# GitGuardian dashboard on already-pushed commits — the Good Samaritan
# emails — are closed by marking them false positive there, once; this
# file keeps local and CI scans quiet about the same class of content.
#
# What is ignored, and why each is public by construction:
#
#   tests/vectors/    x509/TLS test vectors: PEM and hex-encoded
#                     *certificates* (the public half of a key pair)
#                     generated by scripts/x509_matrix.py for the chain
#                     matrix. The private keys never leave the generator.
#   .lex-sys-vcs/     the content-addressed package stores: op logs and
#                     manifests whose sig_id/stage_id/source_hash fields
#                     are BLAKE3 hex digests — high entropy by design,
#                     never credentials.
#
# Nothing here weakens a real check: both paths hold generated public
# data, and every other file in the repository scans as before.

secret:
  paths-ignore:
    - "tests/vectors/**"
    - "**/.lex-sys-vcs/**"
