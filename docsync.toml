# docsync.toml — generated documentation blocks (lex-sys docsync /
# --check). Each target's stdout-producing generator is the source of
# truth; CI runs `lex-sys docsync --check` so drift is a red build, never
# a discovery. Ported from lex-lang's own docsync.toml/lex-cli mechanism,
# sharing the idea and no code (docs/vcs.md §5's own precedent for this
# repository's relationship to lex-lang).

# The mechanical facts in README.md's "Repo, by the numbers" line --
# crate/example/doc counts, the Net outbound/inbound tally -- generated
# from the repository as it stands rather than hand-counted and hand-
# edited (docs/net.md's own count has been hand-edited twice in this
# repository's history for exactly that reason).
[[block]]
id = "repo-stats"
path = "README.md"
command = "cargo run -q -p lex-sys -- repo-stats"
